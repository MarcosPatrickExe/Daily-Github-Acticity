<style>
  .fundo { fill: #ffffff; }
  .titulo { font: 600 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1f2328; }
  .escala { font: 10px system-ui, -apple-system, Segoe UI, sans-serif; fill: #6a737d; }
