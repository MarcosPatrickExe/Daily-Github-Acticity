    .escala, .rodape { fill: #8b949e; }
    .eixo { stroke: #30363d; }
    .inscritos { stroke: #58a6ff; }
    .inscritos.area { fill: #58a6ff; }
    .inscritos.ponto, .inscritos.valor { fill: #58a6ff; }
