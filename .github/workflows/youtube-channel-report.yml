name: Relatório do canal do YouTube

on:
  # 15:30 UTC = 12:30 no horário de Brasília (UTC-3, sem horário de verão).
  # Atenção: o GitHub só dispara agendamentos a partir da branch padrão do repositório.
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      channel_url:
        description: "URL ou @handle do canal"
        required: false
        default: "https://youtube.com/@patrickson_plays"
      max_videos:
        description: "Quantos vídeos recentes detalhar"
        required: false
        default: "10"
      sem_comentarios:
        description: "Pular a contagem de comentários (coleta mais rápida)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write  # usada só para avisar quando o diagnóstico acusa problema

concurrency:
  group: youtube-channel-report
  cancel-in-progress: false

jobs:
  coletar:
    name: Coletar e publicar o relatório
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      YT_CHANNEL_URL: ${{ inputs.channel_url || 'https://youtube.com/@patrickson_plays' }}
      YT_MAX_VIDEOS: ${{ inputs.max_videos || '10' }}
      YT_OUTPUT_DIR: reports/youtube

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Instalar dependências
        run: pip install -r scripts/requirements.txt

      - name: Testar as funções puras
        run: |
          python scripts/test_parsers.py
          python scripts/test_historico.py

      - name: Instalar o Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      # `continue-on-error` para que o relatório e o histórico sejam publicados
      # mesmo com problemas — quem reprova a execução é o passo de diagnóstico.
      - name: Coletar os dados do canal
        id: coleta
        continue-on-error: true
        run: |
          python scripts/youtube_channel_scraper.py \
            --channel "$YT_CHANNEL_URL" \
            --max-videos "$YT_MAX_VIDEOS" \
            --output-dir "$YT_OUTPUT_DIR" \
            --falhar-com-problemas \
            ${{ inputs.sem_comentarios && '--sem-comentarios' || '' }}

      - name: Publicar o relatório no repositório
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$YT_OUTPUT_DIR"
          if git diff --staged --quiet; then
            echo "Nenhuma mudança no relatório — nada a commitar."
            exit 0
          fi
          git commit -m "docs(youtube): relatório do canal em $(TZ=America/Fortaleza date +%Y-%m-%d)"
          for tentativa in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push falhou (tentativa $tentativa); nova tentativa em $((2 ** tentativa))s."
            sleep $((2 ** tentativa))
          done
          echo "Não foi possível publicar o relatório após 4 tentativas." >&2
          exit 1

      - name: Guardar o relatório como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-youtube
          path: reports/youtube/
          if-no-files-found: warn
          retention-days: 30

      # Uma coleta pode terminar "verde" publicando dados vazios. Quando o
      # diagnóstico acusa isso, a execução reprova e o aviso vira uma issue.
      - name: Avisar sobre problemas na coleta
        if: always() && steps.coleta.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITULO: "⚠️ Coleta do canal do YouTube com problemas"
          # Busca sem emoji: a pesquisa do GitHub tokeniza melhor só com texto.
          BUSCA: "Coleta do canal do YouTube com problemas"
        run: |
          problemas=$(jq -r '.diagnostico.problemas[]? | "- \(.)"' \
            "$YT_OUTPUT_DIR/latest.json" 2>/dev/null || true)
          if [ -z "$problemas" ]; then
            problemas="- A coleta falhou antes de gerar o diagnóstico. Veja os logs da execução."
          fi

          execucao="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          corpo=$(printf '%s\n' \
            "A coleta de $(TZ=America/Fortaleza date +%d/%m/%Y) terminou com problemas:" \
            "" \
            "$problemas" \
            "" \
            "Execução: $execucao" \
            "" \
            "O relatório do dia foi publicado assim mesmo — confira os números antes de usá-los." \
            "" \
            "_Issue aberta automaticamente pelo workflow \`${GITHUB_WORKFLOW}\`._")

          echo "$corpo" >> "$GITHUB_STEP_SUMMARY"

          existente=$(gh issue list --state open --search "\"$BUSCA\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existente" ]; then
            gh issue comment "$existente" --body "$corpo"
          else
            gh issue create --title "$TITULO" --body "$corpo"
          fi

          echo "::error::A coleta reprovou no diagnóstico." >&2
          exit 1
